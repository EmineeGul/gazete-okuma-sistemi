<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><ui:insert name="title">HABER_KONSOLU</ui:insert></title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="css" name="bootstrap.css" />
    <h:outputStylesheet library="css" name="stil.css" />
</h:head>

<h:body styleClass="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-haber mt-3 mx-3 mx-md-4 rounded-4">
        <div class="container-fluid px-3 px-md-4">
            <h:link outcome="/index.xhtml" styleClass="navbar-brand marka-haber text-decoration-none">
                HABER_KONSOLU
            </h:link>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ustMenu"
                    aria-controls="ustMenu" aria-expanded="false" aria-label="Menüyü Aç">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="ustMenu">
                <div class="navbar-nav ms-auto ortak-navbar-menu align-items-lg-center">
                    <h:link outcome="/index.xhtml" styleClass="nav-link px-3">Ana Sayfa</h:link>
                    <h:link outcome="/kategori-haberleri.xhtml" styleClass="nav-link px-3">Kategoriler</h:link>
                    <h:link outcome="/panel/favoriler.xhtml" styleClass="nav-link px-3">Favoriler</h:link>
                    <h:link outcome="/panel/admin-haber-liste.xhtml"
                            rendered="#{girisBean.adminMi()}"
                            styleClass="nav-link px-3">
                        Admin Panel
                    </h:link>

                    <div class="nav-item dropdown hesap-dropdown">
                        <a class="nav-link dropdown-toggle px-3" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Hesap
                        </a>

                        <div class="dropdown-menu dropdown-menu-end dropdown-menu-dark hesap-dropdown-menu">
                            <h:panelGroup rendered="#{girisBean.girisYapilmisMi()}">
                                <div class="dropdown-header hesap-ozet">#{girisBean.hesapGosterim}</div>
                                <div><hr class="dropdown-divider" /></div>
                                <h:form styleClass="dropdown-form">
                                    <h:commandLink action="#{girisBean.cikisYap}" styleClass="dropdown-item">
                                        Cikis Yap
                                    </h:commandLink>
                                </h:form>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{not girisBean.girisYapilmisMi()}">
                                <h:link outcome="/giris.xhtml" styleClass="dropdown-item">
                                    Giris Yap
                                </h:link>
                                <h:link outcome="/kayit.xhtml" styleClass="dropdown-item">
                                    Kayit Ol
                                </h:link>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5 sayfa-icerik-alani flex-grow-1">
        <ui:insert name="icerik" />
    </main>

    <footer class="alt-bilgi mt-auto py-4">
        <div class="container text-center">
            <p class="alt-bilgi-metin mb-0">© 2026 Haber Konsolu</p>
        </div>
    </footer>

    <h:outputScript library="js" name="bootstrap.bundle.js" target="body" />
</h:body>
</html>
