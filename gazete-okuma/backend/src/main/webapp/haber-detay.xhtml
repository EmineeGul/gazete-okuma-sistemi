<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="haberId" value="#{haberBean.haberId}" />
        <f:viewParam name="haberId" value="#{yorumBean.haberId}" />
        <f:viewAction action="#{haberBean.seciliHaberiYukle}" />
        <f:viewAction action="#{yorumBean.yorumlariYukle}" />
    </f:metadata>

    <ui:define name="icerik">

        <!-- ===== YORUM CSS ===== -->
        <style>
            .yorum-bolumu {
                margin-top: 40px;
                padding: 32px;
                background: #16172D;
                border: 1px solid rgba(0,255,255,0.18);
                border-radius: 1rem;
                box-shadow: 0 0 20px rgba(0,255,255,0.05);
            }

            .yorum-baslik {
                color: #FFFFFF;
                font-size: 28px;
                font-weight: 700;
            }

            .yorum-sayisi {
                color: #9AA0C3;
            }

            .yorum-textarea {
                width: 100%;
                min-height: 160px;
                background: #111220;
                color: #E2E0F5;
                border: 1px solid rgba(0,255,255,0.3);
                border-radius: 1rem;
                padding: 15px;
                resize: vertical;
            }

            .yorum-textarea:focus {
                border-color: #00FFFF;
                box-shadow: 0 0 10px rgba(0,255,255,0.2);
                outline: none;
            }

            .yorum-buton {
                background: transparent;
                border: 1px solid #00FFFF;
                color: #00FFFF;
                padding: 10px 20px;
                border-radius: 0.7rem;
                font-weight: bold;
                transition: 0.2s;
            }

            .yorum-buton:hover {
                background: rgba(0,255,255,0.1);
                color: white;
            }

            .yorum-karti {
                background: #111220;
                border: 1px solid rgba(0,255,255,0.1);
                border-radius: 1rem;
                padding: 15px;
                margin-top: 15px;
            }

            .yorum-yazar {
                color: #00FFFF;
            }

            .yorum-metin {
                color: #E2E0F5;
            }

            .yorum-yardim {
                color: #9AA0C3;
            }
        </style>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">

                <!-- ===== HABER ===== -->
                <h:panelGroup rendered="#{not empty haberBean.seciliHaber}">
                    <div class="card haber-detay-karti">

                        <img src="#{gorselYoluBean.gorselYoluGetir(haberBean.seciliHaber)}"
                             class="haber-detay-gorsel" />

                        <div class="card-body">

                            <h1 class="haber-detay-baslik">
                                #{haberBean.seciliHaber.baslik}
                            </h1>

                            <p class="haber-detay-ozet">
                                #{haberBean.seciliHaber.ozet}
                            </p>

                            <p>
                                #{haberBean.seciliHaber.icerik}
                            </p>

                            <!-- ===== YORUMLAR ===== -->
                            <section class="yorum-bolumu">

                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <h2 class="yorum-baslik">Yorumlar</h2>
                                    <span class="yorum-sayisi">
                                        #{empty yorumBean.yorumlar ? 0 : yorumBean.yorumlar.size()} yorum
                                    </span>
                                </div>

                                <!-- FORM -->
                                <h:form rendered="#{not girisBean.adminMi()}">

                                    <h:messages globalOnly="true" />

                                    <h:inputTextarea value="#{yorumBean.yorumIcerik}"
                                                     styleClass="yorum-textarea"
                                                     maxlength="300"
                                                     required="true"
                                                     requiredMessage="Yorum bos olamaz." />

                                    <br/><br/>

                                    <div style="display:flex; justify-content:space-between;">
                                        <span class="yorum-yardim">En fazla 300 karakter</span>

                                        <h:commandButton value="Yorum Yap"
                                                         action="#{yorumBean.yorumEkle}"
                                                         styleClass="yorum-buton" />
                                    </div>
                                </h:form>

                                <!-- BOS -->
                                <h:panelGroup rendered="#{empty yorumBean.yorumlar}">
                                    <p class="yorum-yardim">
                                        Bu habere henuz yorum yapilmamis.
                                    </p>
                                </h:panelGroup>

                                <!-- LISTE -->
                                <ui:repeat value="#{yorumBean.yorumlar}" var="yorum">
                                    <div class="yorum-karti">

                                        <strong class="yorum-yazar">
                                            #{yorum.kullanici.kullaniciAdi}
                                        </strong>

                                        <p class="yorum-metin">
                                            #{yorum.icerik}
                                        </p>

                                    </div>
                                </ui:repeat>

                            </section>

                        </div>
                    </div>
                </h:panelGroup>

            </div>
        </div>

    </ui:define>
</ui:composition>
