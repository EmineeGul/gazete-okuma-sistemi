<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
<f:metadata>
    <f:viewParam name="haberId" value="#{haberGuncelleBean.haberId}" />
</f:metadata>
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haber Düzenle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <h:outputStylesheet library="css" name="stil.css" />
    <style>
        .sayfa-sarmalayici {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .haber-karti {
            max-width: 920px;
            margin: 0 auto;
        }

        .form-etiketi {
            color: #cfd3ff;
            font-weight: 500;
            margin-bottom: 0.55rem;
        }

        .form-kontrolu,
        .form-secimi {
            background-color: #0F1124;
            border: 1px solid rgba(0, 255, 255, 0.18);
            color: #F4F7FF;
            border-radius: 0.9rem;
            padding: 0.85rem 1rem;
            box-shadow: none;
        }

        .form-kontrolu:focus,
        .form-secimi:focus {
            background-color: #11142A;
            color: #FFFFFF;
            border-color: #00FFFF;
            box-shadow: 0 0 0 0.2rem rgba(0, 255, 255, 0.15);
        }

        .form-kontrolu::placeholder {
            color: #7F86B5;
        }

        .alt-bilgi {
            color: #9AA0C3;
            font-size: 0.95rem;
        }

        .duzenle-buton {
            background: linear-gradient(90deg, #00FFFF, #00C8FF);
            color: #0D0E1C;
            border: 0;
            border-radius: 999px;
            font-weight: 700;
            padding: 0.85rem 1.5rem;
        }

        .duzenle-buton:hover {
            background: linear-gradient(90deg, #76FFFF, #33D9FF);
            color: #0D0E1C;
        }

        .geri-buton {
            border-radius: 999px;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
        }
    </style>
</h:head>

<h:body>
    <div class="container py-5 sayfa-sarmalayici">
        <div class="w-100">
            <div class="haber-karti p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="bolum-basligi haber-baslik mb-3">Haber Düzenle</h1>
                    <p class="alt-bilgi mb-0">Seçilen haberin bilgilerini güncelleyip değişiklikleri kaydedebilirsiniz.</p>
                </div>

                <h:messages globalOnly="true"
                            layout="list"
                            infoClass="alert alert-info mb-4"
                            warnClass="alert alert-warning mb-4"
                            errorClass="alert alert-danger mb-4"
                            fatalClass="alert alert-danger mb-4" />

                <h:form rendered="#{not empty haberGuncelleBean.haber}">
                    <div class="row g-4">
                        <div class="col-12">
                            <label for="baslik" class="form-etiketi">Haber Başlığı</label>
                            <h:inputText id="baslik"
                                         value="#{haberGuncelleBean.haber.baslik}"
                                         styleClass="form-control form-kontrolu"
                                         required="true"
                                         requiredMessage="Haber başlığı zorunludur."
                                         pt:placeholder="Haber başlığını girin" />
                        </div>

                        <div class="col-12">
                            <label for="ozet" class="form-etiketi">Özet</label>
                            <h:inputTextarea id="ozet"
                                             value="#{haberGuncelleBean.haber.ozet}"
                                             styleClass="form-control form-kontrolu"
                                             rows="3"
                                             pt:placeholder="Haber özetini girin" />
                        </div>

                        <div class="col-12">
                            <label for="icerik" class="form-etiketi">İçerik</label>
                            <h:inputTextarea id="icerik"
                                             value="#{haberGuncelleBean.haber.icerik}"
                                             styleClass="form-control form-kontrolu"
                                             rows="7"
                                             pt:placeholder="Haber içeriğini girin" />
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="gorselUrl" class="form-etiketi">Görsel URL</label>
                            <h:inputText id="gorselUrl"
                                         value="#{haberGuncelleBean.haber.gorselUrl}"
                                         styleClass="form-control form-kontrolu"
                                         pt:placeholder="https://ornek.com/gorsel.jpg" />
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="haberLinki" class="form-etiketi">Haber Linki</label>
                            <h:inputText id="haberLinki"
                                         value="#{haberGuncelleBean.haber.haberLinki}"
                                         styleClass="form-control form-kontrolu"
                                         pt:placeholder="https://ornek.com/haber" />
                        </div>

                        <div class="col-12">
                            <label for="yayinTarihi" class="form-etiketi">Yayın Tarihi</label>
                            <h:inputText id="yayinTarihi"
                                         value="#{haberGuncelleBean.haber.yayinTarihi}"
                                         styleClass="form-control form-kontrolu"
                                         pt:placeholder="Yayın tarihi" />
                        </div>

                        <div class="col-12 d-flex flex-column flex-md-row gap-3 justify-content-between align-items-stretch align-items-md-center pt-2">
                            <a href="admin-haber-liste.xhtml" class="btn btn-outline-info geri-buton">Listeye Dön</a>
                            <h:commandButton value="Güncelle"
                                             action="#{haberGuncelleBean.guncelle}"
                                             styleClass="btn duzenle-buton" />
                        </div>
                    </div>
                </h:form>

                <h:panelGroup rendered="#{empty haberGuncelleBean.haber}" layout="block">
                    <div class="alert alert-danger mb-0 text-center">
                        Güncellenecek haber bilgisi yüklenemedi.
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
