<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Yonetici Girisi | HABER_KONSOLU</ui:define>

    <ui:define name="icerik">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card haber-karti">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="bolum-basligi h2 mb-3">Yonetici Girisi</h1>
                            <p class="text-secondary mb-0">Yonetim paneline erismek icin yonetici bilgilerinizi girin.</p>
                        </div>

                        <h:form>
                            <h:panelGroup id="mesajAlani" layout="block" styleClass="mb-4">
                                <h:messages globalOnly="true"
                                            layout="list"
                                            styleClass="alert alert-danger mb-0" />
                            </h:panelGroup>

                            <div class="mb-3">
                                <label for="eposta" class="form-label text-light">E-posta</label>
                                <h:inputText id="eposta"
                                             value="#{girisBean.eposta}"
                                             styleClass="form-control bg-dark text-light border-secondary"
                                             pt:placeholder="eposta@example.com"
                                             required="true" />
                            </div>

                            <div class="mb-4">
                                <label for="sifre" class="form-label text-light">Sifre</label>
                                <h:inputSecret id="sifre"
                                               value="#{girisBean.sifre}"
                                               styleClass="form-control bg-dark text-light border-secondary"
                                               pt:placeholder="Sifrenizi girin"
                                               required="true" />
                            </div>

                            <div class="d-grid">
                                <h:commandButton value="Yonetici Girisi"
                                                 action="#{girisBean.adminGirisYap}"
                                                 styleClass="btn btn-haber" />
                            </div>

                            <div class="text-center mt-4">
                                <span class="text-secondary">Normal kullanici misin? </span>
                                <h:outputLink value="giris.xhtml" styleClass="text-decoration-none" style="color: #00FFFF;">
                                    Kullanici girisine don
                                </h:outputLink>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
