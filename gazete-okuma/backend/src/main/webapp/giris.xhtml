<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Giris | HABER_KONSOLU</ui:define>

    <ui:define name="icerik">

        <style>
            .giris-input,
            .giris-input:focus,
            .giris-input:-webkit-autofill,
            .giris-input:-webkit-autofill:hover,
            .giris-input:-webkit-autofill:focus {
                background-color: #111220 !important;
                color: #FFFFFF !important;
                -webkit-text-fill-color: #FFFFFF !important;
                border: 1px solid rgba(0, 255, 255, 0.35) !important;
                box-shadow: 0 0 0 1000px #111220 inset !important;
                caret-color: #FFFFFF !important;
            }

            .giris-input::placeholder {
                color: #9AA0C3 !important;
            }
        </style>

        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card haber-karti">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="bolum-basligi h2 mb-3">Giris Yap</h1>
                            <p class="text-secondary mb-0">Haber konsoluna erismek icin bilgilerinizi girin.</p>
                        </div>

                        <h:form pt:autocomplete="off">
                            <h:panelGroup id="mesajAlani" layout="block" styleClass="mb-4">
                                <h:messages globalOnly="true"
                                            layout="list"
                                            styleClass="alert alert-danger mb-0" />
                            </h:panelGroup>

                            <div class="mb-3">
                                <label for="eposta" class="form-label text-light">E-posta</label>
                                <h:inputText id="eposta"
                                             value="#{girisBean.eposta}"
                                             styleClass="form-control giris-input"
                                             pt:placeholder="eposta@example.com"
                                             pt:autocomplete="new-password"
                                             required="true" />
                            </div>

                            <div class="mb-4">
                                <label for="sifre" class="form-label text-light">Sifre</label>
                                <h:inputSecret id="sifre"
                                               value="#{girisBean.sifre}"
                                               styleClass="form-control giris-input"
                                               pt:placeholder="Sifrenizi girin"
                                               pt:autocomplete="new-password"
                                               required="true" />
                            </div>

                            <div class="d-grid">
                                <h:commandButton value="Giris Yap"
                                                 action="#{girisBean.girisYap}"
                                                 styleClass="btn btn-haber" />
                            </div>

                            <div class="text-center mt-3">
                                <h:outputLink value="sifremi-unuttum.xhtml"
                                              styleClass="text-decoration-none"
                                              style="color: #00FFFF;">
                                    Sifremi unuttum
                                </h:outputLink>
                            </div>

                            <div class="text-center mt-3">
                                <h:outputLink value="admin-giris.xhtml"
                                              styleClass="text-decoration-none"
                                              style="color: #00FFFF;">
                                    Yonetici Girisi
                                </h:outputLink>
                            </div>

                            <div class="text-center mt-4">
                                <span class="text-secondary">Hesabin yok mu? </span>
                                <h:outputLink value="kayit.xhtml"
                                              styleClass="text-decoration-none"
                                              style="color: #00FFFF;">
                                    Kayit ol
                                </h:outputLink>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
