<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Haber Ekle | HABER_KONSOLU</ui:define>

    <ui:define name="icerik">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card haber-karti">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h1 class="h3 mb-2 haber-baslik">Yeni Haber Ekle</h1>
                            <p class="text-secondary mb-0">Yeni haber kaydi icin asagidaki formu doldurun.</p>
                        </div>

                        <h:form>
                            <h:messages globalOnly="true"
                                        layout="list"
                                        infoClass="alert alert-info mb-4"
                                        warnClass="alert alert-warning mb-4"
                                        errorClass="alert alert-danger mb-4"
                                        fatalClass="alert alert-danger mb-4" />

                            <div class="mb-3">
                                <label for="baslik" class="form-label text-light">Haber Basligi</label>
                                <h:inputText id="baslik"
                                             value="#{haberEkleBean.baslik}"
                                             styleClass="form-control bg-dark text-light border-secondary"
                                             required="true"
                                             requiredMessage="Haber basligi zorunludur."
                                             pt:placeholder="Haber basligini girin" />
                            </div>

                            <div class="mb-3">
                                <label for="ozet" class="form-label text-light">Ozet</label>
                                <h:inputTextarea id="ozet"
                                                 value="#{haberEkleBean.ozet}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 rows="3"
                                                 pt:placeholder="Kisa haber ozeti" />
                            </div>

                            <div class="mb-3">
                                <label for="icerik" class="form-label text-light">Icerik</label>
                                <h:inputTextarea id="icerik"
                                                 value="#{haberEkleBean.icerik}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 rows="6"
                                                 pt:placeholder="Haber icerigini girin" />
                            </div>

                            <div class="mb-3">
                                <label for="gorselUrl" class="form-label text-light">Gorsel URL</label>
                                <h:inputText id="gorselUrl"
                                             value="#{haberEkleBean.gorselUrl}"
                                             styleClass="form-control bg-dark text-light border-secondary"
                                             pt:placeholder="https://ornek.com/gorsel.jpg" />
                            </div>

                            <div class="mb-3">
                                <label for="haberLinki" class="form-label text-light">Haber Linki</label>
                                <h:inputText id="haberLinki"
                                             value="#{haberEkleBean.haberLinki}"
                                             styleClass="form-control bg-dark text-light border-secondary"
                                             pt:placeholder="https://ornek.com/haber" />
                            </div>

                            <div class="mb-3">
                                <label for="kategori" class="form-label text-light">Kategori</label>
                                <h:selectOneMenu id="kategori"
                                                 value="#{haberEkleBean.secilenKategoriId}"
                                                 required="true"
                                                 requiredMessage="Kategori secimi zorunludur."
                                                 styleClass="form-select bg-dark text-light border-secondary">
                                    <f:selectItem itemLabel="Kategori secin" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{haberEkleBean.kategoriler}"
                                                   var="kategori"
                                                   itemValue="#{kategori.id}"
                                                   itemLabel="#{kategori.kategoriAdi}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="mb-4">
                                <label for="kaynak" class="form-label text-light">Gazete Kaynagi</label>
                                <h:selectOneMenu id="kaynak"
                                                 value="#{haberEkleBean.secilenKaynakId}"
                                                 required="true"
                                                 requiredMessage="Gazete kaynagi secimi zorunludur."
                                                 styleClass="form-select bg-dark text-light border-secondary">
                                    <f:selectItem itemLabel="Kaynak secin" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{haberEkleBean.gazeteKaynaklari}"
                                                   var="kaynak"
                                                   itemValue="#{kaynak.id}"
                                                   itemLabel="#{kaynak.kaynakAdi}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="d-grid">
                                <h:commandButton value="Kaydet"
                                                 action="#{haberEkleBean.haberKaydet}"
                                                 styleClass="btn btn-haber btn-lg">
                                    <f:ajax execute="@form" render="@form" />
                                </h:commandButton>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
