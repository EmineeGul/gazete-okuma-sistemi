<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haber Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</h:head>

<h:body styleClass="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h1 class="h3 mb-2">Yeni Haber Ekle</h1>
                            <p class="text-muted mb-0">Yeni haber kaydı için aşağıdaki formu doldurun.</p>
                        </div>

                        <h:form>
                            <h:messages globalOnly="true"
                                        layout="list"
                                        infoClass="alert alert-info mb-4"
                                        warnClass="alert alert-warning mb-4"
                                        errorClass="alert alert-danger mb-4"
                                        fatalClass="alert alert-danger mb-4" />

                            <div class="mb-3">
                                <label for="baslik" class="form-label">Haber Başlığı</label>
                                <h:inputText id="baslik"
                                             value="#{haberEkleBean.baslik}"
                                             styleClass="form-control"
                                             required="true"
                                             requiredMessage="Haber başlığı zorunludur."
                                             pt:placeholder="Haber başlığını girin" />
                            </div>

                            <div class="mb-3">
                                <label for="ozet" class="form-label">Özet</label>
                                <h:inputTextarea id="ozet"
                                                 value="#{haberEkleBean.ozet}"
                                                 styleClass="form-control"
                                                 rows="3"
                                                 pt:placeholder="Kısa haber özeti" />
                            </div>

                            <div class="mb-3">
                                <label for="icerik" class="form-label">İçerik</label>
                                <h:inputTextarea id="icerik"
                                                 value="#{haberEkleBean.icerik}"
                                                 styleClass="form-control"
                                                 rows="6"
                                                 pt:placeholder="Haber içeriğini girin" />
                            </div>

                            <div class="mb-3">
                                <label for="gorselUrl" class="form-label">Görsel URL</label>
                                <h:inputText id="gorselUrl"
                                             value="#{haberEkleBean.gorselUrl}"
                                             styleClass="form-control"
                                             pt:placeholder="https://ornek.com/gorsel.jpg" />
                            </div>

                            <div class="mb-3">
                                <label for="haberLinki" class="form-label">Haber Linki</label>
                                <h:inputText id="haberLinki"
                                             value="#{haberEkleBean.haberLinki}"
                                             styleClass="form-control"
                                             pt:placeholder="https://ornek.com/haber" />
                            </div>

                            <div class="mb-3">
                                <label for="kategori" class="form-label">Kategori</label>
                                <h:selectOneMenu id="kategori"
                                                 value="#{haberEkleBean.secilenKategoriId}"
                                                 required="true"
                                                 requiredMessage="Kategori seçimi zorunludur."
                                                 styleClass="form-select">
                                    <f:selectItem itemLabel="Kategori seçin" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{haberEkleBean.kategoriler}"
                                                   var="kategori"
                                                   itemValue="#{kategori.id}"
                                                   itemLabel="#{kategori.kategoriAdi}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="mb-4">
                                <label for="kaynak" class="form-label">Gazete Kaynağı</label>
                                <h:selectOneMenu id="kaynak"
                                                 value="#{haberEkleBean.secilenKaynakId}"
                                                 required="true"
                                                 requiredMessage="Gazete kaynağı seçimi zorunludur."
                                                 styleClass="form-select">
                                    <f:selectItem itemLabel="Kaynak seçin" itemValue="#{null}" noSelectionOption="true" />
                                    <f:selectItems value="#{haberEkleBean.gazeteKaynaklari}"
                                                   var="kaynak"
                                                   itemValue="#{kaynak.id}"
                                                   itemLabel="#{kaynak.kaynakAdi}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="d-grid">
                                <h:commandButton value="Kaydet"
                                                 action="#{haberEkleBean.haberKaydet}"
                                                 styleClass="btn btn-success btn-lg">
                                    <f:ajax execute="@form" render="@form" />
                                </h:commandButton>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
