<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haber Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</h:head>

<h:body styleClass="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div>
                                <h1 class="h3 mb-1">Haber Yönetimi</h1>
                                <p class="text-muted mb-0">Sistemde kayıtlı haberleri görüntüleyin.</p>
                            </div>
                        </div>

                        <h:panelGroup rendered="#{empty haberBean.haberler}" layout="block">
                            <div class="alert alert-secondary mb-0">
                                Henüz haber bulunmamaktadır.
                            </div>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{not empty haberBean.haberler}" layout="block">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th scope="col">Başlık</th>
                                            <th scope="col">Özet</th>
                                            <th scope="col">Kategori</th>
                                            <th scope="col">Kaynak</th>
                                            <th scope="col">Yayın Tarihi</th>
                                            <th scope="col">Haber Linki</th>
                                            <th scope="col" class="text-center">İşlemler</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{haberBean.haberler}" var="haber">
                                            <tr>
                                                <td class="fw-semibold">#{haber.baslik}</td>
                                                <td>#{haber.ozet}</td>
                                                <td>#{haber.kategori.kategoriAdi}</td>
                                                <td>#{haber.haberKaynagi.ad}</td>
                                                <td>#{haber.yayinTarihi}</td>
                                                <td>
                                                    <h:outputLink value="#{haber.haberLinki}"
                                                                  rendered="#{not empty haber.haberLinki}"
                                                                  styleClass="btn btn-outline-primary btn-sm"
                                                                  target="_blank">
                                                        Linki Aç
                                                    </h:outputLink>
                                                    <h:panelGroup rendered="#{empty haber.haberLinki}">
                                                        <span class="text-muted">Yok</span>
                                                    </h:panelGroup>
                                                </td>
                                                <td class="text-center">
                                                    <div class="d-flex justify-content-center gap-2">
                                                        <a href="#" class="btn btn-outline-secondary btn-sm">Düzenle</a>
                                                        <a href="#" class="btn btn-outline-danger btn-sm">Sil</a>
                                                    </div>
                                                </td>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
