<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kayit Ol | HABER_KONSOLU</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <h:outputStylesheet library="css" name="stil.css" />
</h:head>

<h:body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-haber mt-3 mx-3 mx-md-4 rounded-4">
        <div class="container-fluid px-3 px-md-4">
            <h:outputLink value="index.xhtml" styleClass="navbar-brand marka-haber text-decoration-none">
                HABER_KONSOLU
            </h:outputLink>

            <div class="navbar-nav ms-auto">
                <h:outputLink value="index.xhtml" styleClass="nav-link px-3">Ana Sayfa</h:outputLink>
                <h:outputLink value="giris.xhtml" styleClass="nav-link px-3">Giris</h:outputLink>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="card haber-karti">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="bolum-basligi h2 mb-3">Kayit Ol</h1>
                            <p class="text-secondary mb-0">Yeni hesap olusturup haber konsoluna katilin.</p>
                        </div>

                        <h:form>
                            <h:panelGroup layout="block" styleClass="mb-4">
                                <h:messages globalOnly="true"
                                            layout="list"
                                            infoClass="alert alert-info mb-0"
                                            warnClass="alert alert-warning mb-0"
                                            errorClass="alert alert-danger mb-0"
                                            fatalClass="alert alert-danger mb-0" />
                            </h:panelGroup>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="kullaniciAdi" class="form-label text-light">Kullanici Adi</label>
                                    <h:inputText id="kullaniciAdi"
                                                 value="#{kayitBean.kullaniciAdi}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 pt:placeholder="kullaniciadi"
                                                 required="true" />
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="ad" class="form-label text-light">Ad</label>
                                    <h:inputText id="ad"
                                                 value="#{kayitBean.ad}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 pt:placeholder="Adiniz"
                                                 required="true" />
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="soyad" class="form-label text-light">Soyad</label>
                                    <h:inputText id="soyad"
                                                 value="#{kayitBean.soyad}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 pt:placeholder="Soyadiniz"
                                                 required="true" />
                                </div>

                                <div class="col-12">
                                    <label for="eposta" class="form-label text-light">E-posta</label>
                                    <h:inputText id="eposta"
                                                 value="#{kayitBean.eposta}"
                                                 styleClass="form-control bg-dark text-light border-secondary"
                                                 pt:placeholder="eposta@example.com"
                                                 required="true" />
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="sifre" class="form-label text-light">Sifre</label>
                                    <h:inputSecret id="sifre"
                                                   value="#{kayitBean.sifre}"
                                                   styleClass="form-control bg-dark text-light border-secondary"
                                                   pt:placeholder="Sifrenizi girin"
                                                   required="true" />
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="sifreTekrar" class="form-label text-light">Sifre Tekrar</label>
                                    <h:inputSecret id="sifreTekrar"
                                                   value="#{kayitBean.sifreTekrar}"
                                                   styleClass="form-control bg-dark text-light border-secondary"
                                                   pt:placeholder="Sifreyi tekrar girin"
                                                   required="true" />
                                </div>
                            </div>

                            <div class="mt-3">
                                <small class="text-secondary">Sifre en az 8 karakter olmali; buyuk harf, kucuk harf ve ozel karakter icermelidir.</small>
                            </div>

                            <div class="d-grid mt-4">
                                <h:commandButton value="Kayit Ol"
                                                 action="#{kayitBean.kayitOl}"
                                                 styleClass="btn btn-haber" />
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</h:body>
</html>
