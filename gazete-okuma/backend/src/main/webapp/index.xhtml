<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="icerik">
        <div class="text-center mb-5">
            <h1 class="bolum-basligi">Son Haberler</h1>
            <p class="text-secondary mt-3 mb-0">Guncel gelismeleri sade ve duzenli bir akista takip edin.</p>
        </div>

        <h:messages globalOnly="true"
                    layout="list"
                    infoClass="alert alert-info mb-4"
                    warnClass="alert alert-warning mb-4"
                    errorClass="alert alert-danger mb-4"
                    fatalClass="alert alert-danger mb-4" />

        <h:panelGroup rendered="#{empty haberBean.haberler}" layout="block" styleClass="bos-liste-kutusu p-5 text-center">
            <h4 class="mb-2">Henüz haber bulunamadi.</h4>
            <p class="mb-0">Sisteme eklendiginde haberler burada listelenecektir.</p>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty haberBean.haberler}" layout="block">
            <div class="row g-4">
                <ui:repeat value="#{haberBean.haberler}" var="haber">
                    <div class="col-12 col-md-6 col-xl-4">
                        <div class="card haber-karti">
                            <h:form styleClass="favori-form">
                                <h:commandButton value="#{favoriBean.favorideMi(haber) ? '♥' : '♡'}"
                                                 action="#{favoriBean.favoriDegistir(haber)}"
                                                 styleClass="#{favoriBean.favorideMi(haber) ? 'favori-buton aktif' : 'favori-buton'}" />
                            </h:form>

                            <img src="#{not empty haber.gorselUrl ? haber.gorselUrl : request.contextPath.concat('/resources/images/default-news.jpg')}"
                                 class="haber-gorsel"
                                 alt="#{haber.baslik}" />

                            <div class="card-body d-flex flex-column p-4">
                                <div class="d-flex flex-wrap gap-2 mb-3">
                                    <h:panelGroup rendered="#{not empty haber.kategori and not empty haber.kategori.kategoriAdi}">
                                        <span class="badge rounded-pill rozet-kategori">#{haber.kategori.kategoriAdi}</span>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{not empty haber.haberKaynagi and not empty haber.haberKaynagi.ad}">
                                        <span class="badge rounded-pill rozet-kaynak">#{haber.haberKaynagi.ad}</span>
                                    </h:panelGroup>
                                </div>

                                <h3 class="haber-baslik h5 mb-3">#{haber.baslik}</h3>
                                <p class="haber-bilgi mb-2">
                                    <strong class="text-light">Yayin Tarihi:</strong> #{haber.yayinTarihi}
                                </p>
                                <p class="card-text text-light-emphasis mb-4 flex-grow-1">#{haber.ozet}</p>

                                <h:link outcome="haber-detay.xhtml"
                                        styleClass="btn btn-haber align-self-start">
                                    <f:param name="haberId" value="#{haber.id}" />
                                    Haberi Oku
                                </h:link>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </h:panelGroup>
    </ui:define>

</ui:composition>
