<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Gazete Okuma Sistemi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />
</h:head>

<h:body styleClass="bg-body-tertiary">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-lg-5">

                        <!-- Başlık -->
                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                            <div>
                                <p class="text-uppercase text-secondary fw-semibold small mb-2">
                                    Guncel Haberler
                                </p>
                                <h1 class="h2 mb-2">Gazete Haber Listesi</h1>
                                <p class="text-secondary mb-0">
                                    Baslik, ozet ve detay baglantilarini duzenli bir gorunumde inceleyin.
                                </p>
                            </div>
                            <span class="badge text-bg-dark fs-6">Jakarta Faces</span>
                        </div>

                        <!-- Tablo -->
                        <h:form>
                            <div class="table-responsive">
                                <h:dataTable value="#{haberBean.haberler}"
                                             var="haber"
                                             styleClass="table table-striped table-hover align-middle mb-0">

                                    <!-- Başlık -->
                                    <h:column>
                                        <f:facet name="header">
                                            <span class="fw-semibold text-dark">Baslik</span>
                                        </f:facet>
                                        <div class="fw-semibold text-dark">
                                            #{haber.baslik}
                                        </div>
                                    </h:column>

                                    <!-- Özet -->
                                    <h:column>
                                        <f:facet name="header">
                                            <span class="fw-semibold text-dark">Ozet</span>
                                        </f:facet>
                                        <div class="text-secondary">
                                            #{haber.ozet}
                                        </div>
                                    </h:column>

                                    <!-- İşlem -->
                                    <h:column>
                                        <f:facet name="header">
                                            <span class="fw-semibold text-dark">Islem</span>
                                        </f:facet>

                                        <h:link value="Detay"
                                                outcome="news"
                                                styleClass="btn btn-outline-primary btn-sm">
                                            <f:param name="id" value="#{haber.id}" />
                                        </h:link>
                                    </h:column>

                                </h:dataTable>
                            </div>
                        </h:form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</h:body>
</html>
