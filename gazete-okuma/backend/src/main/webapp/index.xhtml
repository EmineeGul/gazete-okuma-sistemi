<ui:composition template="sablon.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="icerik">
        <div class="text-center mb-5">
            <h1 class="bolum-basligi">Son Haberler</h1>
            <p class="text-secondary mt-3 mb-0">Güncel gelişmeleri sade ve düzenli bir akışta takip edin.</p>
        </div>

        <h:panelGroup rendered="#{empty haberBean.haberler}" layout="block" styleClass="bos-liste-kutusu p-5 text-center">
            <h4 class="mb-2">Henüz haber bulunamadı.</h4>
            <p class="mb-0">Sisteme eklendiğinde haberler burada listelenecektir.</p>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty haberBean.haberler}" layout="block">
            <div class="row g-4">
                <ui:repeat value="#{haberBean.haberler}" var="haber">
                    <div class="col-12 col-md-6 col-xl-4">
                        <div class="card haber-karti">
                            <h:graphicImage value="#{haber.gorselUrl}"
                                            rendered="#{not empty haber.gorselUrl}"
                                            styleClass="haber-gorsel"
                                            alt="#{haber.baslik}" />

                            <div class="card-body d-flex flex-column p-4">
                                <div class="d-flex flex-wrap gap-2 mb-3">
                                    <h:panelGroup rendered="#{not empty haber.kategori and not empty haber.kategori.kategoriAdi}">
                                        <span class="badge rounded-pill rozet-kategori">#{haber.kategori.kategoriAdi}</span>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{not empty haber.gazeteKaynagi and not empty haber.gazeteKaynagi.ad}">
                                        <span class="badge rounded-pill rozet-kaynak">#{haber.gazeteKaynagi.ad}</span>
                                    </h:panelGroup>
                                </div>

                                <h3 class="haber-baslik h5 mb-3">#{haber.baslik}</h3>
                                <p class="haber-bilgi mb-2">
                                    <strong class="text-light">Yayın Tarihi:</strong> #{haber.yayinTarihi}
                                </p>
                                <p class="card-text text-light-emphasis mb-4 flex-grow-1">#{haber.ozet}</p>

                                <h:outputLink value="#{haber.haberLinki}"
                                              rendered="#{not empty haber.haberLinki}"
                                              styleClass="btn btn-haber align-self-start"
                                              target="_blank">
                                    Haberi Oku
                                </h:outputLink>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </h:panelGroup>
    </ui:define>

</ui:composition>
